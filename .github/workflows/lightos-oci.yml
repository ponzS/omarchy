name: Publish LightOS OCI image

on:
  push:
    branches:
      - lightos-oci-v4.0.4
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -f container/Dockerfile -t ghcr.io/ponzs/omarchy:lightos-core-4.0.4 .
      - name: Publish image
        run: docker push ghcr.io/ponzs/omarchy:lightos-core-4.0.4
