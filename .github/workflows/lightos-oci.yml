name: Publish LightOS OCI image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lightos-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check container update scripts
        run: |
          bash -n container/lightos-omarchy-enable-updates
          bash -n container/lightos-omarchy-container.install
      - name: Log in to GHCR
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: >-
          docker build --platform linux/amd64
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -f container/Dockerfile
          -t ghcr.io/ponzs/omarchy:lightos-stable
          -t ghcr.io/ponzs/omarchy:lightos-stable-${{ github.sha }} .
      - name: Publish image
        run: |
          docker push ghcr.io/ponzs/omarchy:lightos-stable-${{ github.sha }}
          docker push ghcr.io/ponzs/omarchy:lightos-stable
