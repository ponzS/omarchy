name: Publish LightOS OCI image

on:
  push:
    branches:
      - lightos-oci-v4.0.4
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lightos-oci-v4.0.4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: >-
          docker build --platform linux/amd64
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -f container/Dockerfile
          -t ghcr.io/ponzs/omarchy:lightos-core-4.0.4-r3
          -t ghcr.io/ponzs/omarchy:lightos-core-4.0.4 .
      - name: Publish image
        run: |
          docker push ghcr.io/ponzs/omarchy:lightos-core-4.0.4-r3
          docker push ghcr.io/ponzs/omarchy:lightos-core-4.0.4
