# LightOS supplies the kernel, boot chain and rootfs lifecycle.
# Keep the genuine official dependencies installed, but do not expose their
# boot entrypoints: Omarchy migrations test for these optional commands.
# This is an extraction policy, not fake dependency providers or success stubs.
NoExtract = usr/bin/limine-* usr/bin/mkinitcpio usr/local/bin/mkinitcpio usr/bin/snapper usr/bin/snapperd
NoExtract = usr/share/libalpm/hooks/*limine*.hook usr/share/libalpm/hooks/*mkinitcpio*.hook
NoExtract = etc/pacman.d/hooks/*limine*.hook etc/pacman.d/hooks/*mkinitcpio*.hook
NoExtract = usr/lib/systemd/system/limine-* usr/lib/systemd/system/snapper* usr/lib/systemd/system/snapper*.wants/*
NoExtract = etc/xdg/autostart/limine-*.desktop
